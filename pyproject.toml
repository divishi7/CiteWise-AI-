    "sentence-transformers>=5.0.0",
    "google-generativeai>=0.8.5",
    "python-dotenv>=1.1.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "transformers>=5.14.1",
]
